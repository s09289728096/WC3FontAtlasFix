name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: sh tools/setup-toolchain.sh
      - run: python3 tools/build.py --tests --toolchain .tools/llvm-mingw-20250613-ucrt-ubuntu-22.04-x86_64
      - run: python3 tools/build.py --debug --tests --toolchain .tools/llvm-mingw-20250613-ucrt-ubuntu-22.04-x86_64
      - run: python3 tools/check_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: |
            build/release/*.mix
            build/release/*.exe
            build/release/manifest.json
            build/debug/*.mix
            build/debug/*.exe
            build/debug/manifest.json
  windows-tests:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86
          path: build
      - run: ./build/release/runtime-test.exe
      - run: ./build/debug/runtime-test.exe
